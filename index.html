<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b141a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/themes.css" />
  <link rel="stylesheet" href="/src/styles/reset.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/responsive.css" />
  <link rel="stylesheet" href="/src/styles/layout-wp.css" />

  <link rel="manifest" href="/public/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/public/icons/icon.png" />
</head>
<body>
  <div id="app">
    <div id="connection-bar" class="connection-bar" aria-live="polite"></div>
    <div id="auth-root" class="auth-screen" hidden></div>

    <div id="app-shell" class="app-shell" hidden>
      <!-- Desktop left icon rail -->
      <nav id="nav-rail" class="nav-rail" aria-label="Main">
        <button type="button" class="nav-rail__btn active" data-route="chats" title="Chats">
          <i class="bi bi-chat-square-text-fill"></i>
        </button>
        <button type="button" class="nav-rail__btn" data-route="people" title="People">
          <i class="bi bi-people-fill"></i>
        </button>
        <button type="button" class="nav-rail__btn" data-route="groups" title="Groups">
          <i class="bi bi-people"></i>
        </button>
        <button type="button" class="nav-rail__btn" data-route="calls" title="Calls">
          <i class="bi bi-telephone-fill"></i>
        </button>
        <div class="nav-rail__spacer"></div>
        <button type="button" class="nav-rail__btn" data-route="settings" title="Settings">
          <i class="bi bi-gear-fill"></i>
        </button>
      </nav>

      <!-- Middle: list panel -->
      <aside id="list-panel" class="list-panel">
        <div id="list-panel-root"></div>
      </aside>

      <!-- Right: conversation / empty -->
      <main id="main-content" class="main-content">
        <div id="page-root" class="page">
          <div class="wp-empty" id="wp-empty">
            <div class="wp-empty__icon"><i class="bi bi-chat-dots"></i></div>
            <h2 class="wp-empty__title">Nexus</h2>
            <p class="wp-empty__desc">Send and receive messages in real time.<br/>Select a chat to start messaging.</p>
            <p class="wp-empty__lock"><i class="bi bi-lock-fill"></i> Your personal messages stay on your devices</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile bottom tabs -->
    <nav id="tab-bar" class="tab-bar" hidden aria-label="Main navigation">
      <button type="button" class="tab-bar__item" data-route="chats"><i class="bi bi-chat-square-text-fill"></i><span>Chats</span></button>
      <button type="button" class="tab-bar__item" data-route="people"><i class="bi bi-people-fill"></i><span>People</span></button>
      <button type="button" class="tab-bar__item" data-route="groups"><i class="bi bi-people"></i><span>Groups</span></button>
      <button type="button" class="tab-bar__item" data-route="calls"><i class="bi bi-telephone-fill"></i><span>Calls</span></button>
      <button type="button" class="tab-bar__item" data-route="settings"><i class="bi bi-gear-fill"></i><span>Settings</span></button>
    </nav>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="overlay-root"></div>
    <div id="call-root"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script type="module" src="/src/core/app.js"></script>
</body>
</html>
